    <rect x="0" y="45" width="20" height="40" rx="4" fill="#64748b" />
    <rect x="130" y="45" width="20" height="40" rx="4" fill="#64748b" />
    <!-- Pistons indicators -->
    <line x1="45" y1="125" x2="45" y2="145" stroke="#e63946" stroke-width="6" stroke-linecap="round" />
    <line x1="75" y1="125" x2="75" y2="145" stroke="#e63946" stroke-width="6" stroke-linecap="round" />
    <line x1="105" y1="125" x2="105" y2="145" stroke="#e63946" stroke-width="6" stroke-linecap="round" />
