      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#engGrad)" />
  <circle cx="200" cy="120" r="85" fill="#334155" opacity="0.3" />
  <!-- Engine block shape -->
  <g transform="translate(125, 45)" fill="#e2e8f0" stroke="#0b3b60" stroke-width="2">
    <rect x="20" y="20" width="110" height="90" rx="10" fill="#f8fafc" />
    <rect x="35" y="5" width="25" height="15" fill="#94a3b8" />
