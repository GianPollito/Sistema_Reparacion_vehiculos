<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="elecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#elecGrad)" />
  <!-- Scanner / Diagnostic tool -->
  <g transform="translate(130, 25)">
    <rect x="0" y="0" width="140" height="135" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Screen -->
    <rect x="15" y="15" width="110" height="75" rx="6" fill="#0c4a6e" />
    <!-- Oscilloscope wave -->
    <path d="M20,52 L45,52 L55,25 L65,75 L75,35 L85,60 L95,52 L120,52" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Diagnostic Buttons -->
    <circle cx="35" cy="110" r="8" fill="#38bdf8" />
    <circle cx="70" cy="110" r="8" fill="#e63946" />
    <circle cx="105" cy="110" r="8" fill="#10b981" />
  </g>
  <text x="200" y="210" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">DIAGNÓSTICO COMPUTARIZADO</text>
</svg>